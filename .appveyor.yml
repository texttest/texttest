environment:
  APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2019
  matrix:
    - MSYS2_ARCH: ucrt-x86_64
      MSYSTEM: ucrt64
#    - MSYS2_ARCH: i686
#      MSYSTEM: MINGW32

install:
    - set PATH=C:\msys64\%MSYSTEM%\bin;C:\msys64\usr\bin;%PATH%
    - pacman --noconfirm -Syyuu --overwrite '*'
    - taskkill /F /FI "MODULES eq msys-2.0.dll"
    - pacman --noconfirm -Syyuu --overwrite '*'

build_script:
    - bash wininstall/build_mingw.sh

artifacts:
    - path: dist\*.zip
    - path: dist\*.msi
