name: Build Windows Package

on:
  workflow_dispatch:  # run on manual trigger
  push:               # run on push events
  pull_request:       # run on pull requests
  schedule:           # check once a week, maybe the dependencies are broken
    - cron:  '25 1 * * 2'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Cloning TextTest
      uses: actions/checkout@v7

    - name: Cloning Meld
      uses: actions/checkout@v7
      with:
        repository: GNOME/meld
        ref: '3.22.0'
        path: meld

    - name: Cloning Adwaita Icons
      uses: actions/checkout@v7
      with:
        repository: GNOME/adwaita-icon-theme
        ref: '41.0'
        path: adwaita-icon-theme

    - uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true

    - name: Building Windows package
      shell: msys2 {0}
      run: bash wininstall/build_mingw.sh

    - uses: actions/upload-artifact@v7
      with:
        name: Windows_installer
        path: dist/*.msi

    - uses: actions/upload-artifact@v7
      with:
        name: Windows_zip
        path: dist/*.zip
